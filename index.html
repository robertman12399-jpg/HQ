<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
  /* ── BENTO: bold light canvas with vivid colour blocks ── */
  --bg:        #ECEAE3;
  --bg2:       #E4E1D8;
  --ink:       #14130F;
  --paper:     #FBFAF6;
  --paper2:    #F3F1EA;

  --text:  #14130F;
  --t2:    #5C5A52;
  --t3:    #9B988D;
  --line:  #DAD7CC;
  --border: #14130F;

  /* Vivid block palette — each section owns a colour */
  --c-violet:  #6C4CE0;
  --c-violetIn:#EDE8FF;
  --c-coral:   #FF5D3B;
  --c-coralIn: #FFE8E2;
  --c-lime:    #B8E62E;
  --c-limeIn:  #F2FBD6;
  --c-sky:     #2BB8F0;
  --c-skyIn:   #DFF4FD;
  --c-amber:   #FFB627;
  --c-amberIn: #FFF2D6;
  --c-pink:    #FF4D8D;
  --c-pinkIn:  #FFE3EE;
  --c-ink:     #14130F;
  --c-mint:    #16C79A;
  --c-mintIn:  #DAF7EF;

  --accent:   #6C4CE0;
  --accentBg: #EDE8FF;
  --accent2:  #FF5D3B;
  --green:  #0E9E6E; --greenBg:#D9F5EB;
  --red:    #E8412A; --redBg:#FCE3DE;
  --amber:  #C77E00; --amberBg:#FFF0D2;
  --blue:   #1B92D6; --blueBg:#DCF1FB;
  --purple: #6C4CE0;

  /* Hard-edged shadow — the signature */
  --hard:   4px 4px 0 var(--ink);
  --hard-sm:3px 3px 0 var(--ink);
  --hard-lg:6px 6px 0 var(--ink);
  --shadow-sm: var(--hard-sm);
  --shadow-md: var(--hard);
  --shadow-lg: var(--hard-lg);
  --shadow-accent: var(--hard);
  --modal-bg: rgba(20,19,15,0.40);

  --radius:    16px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --font: 'Inter', -apple-system, sans-serif;
  --display: 'Space Grotesk', 'Inter', sans-serif;
}

body.dark {
  --bg:        #16140F;
  --bg2:       #1E1B14;
  --ink:       #000000;
  --paper:     #221F18;
  --paper2:    #2A2620;
  --text:  #F7F5EE;
  --t2:    #B0ADA2;
  --t3:    #6E6B60;
  --line:  #332F26;
  --border: #000000;
  --c-violetIn:#2A2348; --c-coralIn:#3A2018; --c-limeIn:#2A3310;
  --c-skyIn:#15303C; --c-amberIn:#3A2E12; --c-pinkIn:#3A1626; --c-mintIn:#13332A;
  --accentBg:#2A2348; --greenBg:#13332A; --redBg:#3A1A14; --amberBg:#3A2E12; --blueBg:#15303C;
  --green:#16C79A; --red:#FF6B52; --amber:#FFB627; --blue:#3FB5F0;
  --hard:4px 4px 0 #000; --hard-sm:3px 3px 0 #000; --hard-lg:6px 6px 0 #000;
  --modal-bg:rgba(0,0,0,0.65);
}

/* ═══════════════════════════════════════════
   CLASSIC DESIGN — clean light, soft shadows, thin borders
   Activated via body[data-design="classic"]
═══════════════════════════════════════════ */
body[data-design="classic"] {
  --bg: #F5F4F2;
  --bg2: #EDEBE7;
  --ink: #1C1C1E;
  --paper: #FFFFFF;
  --paper2: #FAF9F7;
  --text: #1C1C1E;
  --t2: #636366;
  --t3: #AEAEB2;
  --line: #EAE8E4;
  --border-classic: rgba(0,0,0,0.07);
  --accent: #2C5EE8;
  --accentBg: #EEF2FF;
  --accent2: #5B5BD6;
  --green:#2A9D5C; --greenBg:#EDFBF3;
  --red:#D63A3A; --redBg:#FEF2F2;
  --amber:#C47C00; --amberBg:#FFFBEB;
  --blue:#2C5EE8; --blueBg:#EEF2FF;
  --c-violet:#2C5EE8; --c-violetIn:#EEF2FF;
  --c-coral:#D63A3A; --c-coralIn:#FEF2F2;
  --c-lime:#2A9D5C; --c-limeIn:#EDFBF3;
  --c-sky:#2C5EE8; --c-skyIn:#EEF2FF;
  --c-amber:#C47C00; --c-amberIn:#FFFBEB;
  --c-pink:#7C3AED; --c-pinkIn:#F3F0FF;
  --c-mint:#2A9D5C; --c-mintIn:#EDFBF3;
  --hard:0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.03); --hard-sm:0 1px 2px rgba(0,0,0,0.04); --hard-lg:0 8px 32px rgba(0,0,0,0.10);
}
body[data-design="classic"].dark {
  --bg:#0F0F10; --bg2:#1A1A1C; --paper:#1C1C1E; --paper2:#2C2C2E;
  --text:#F5F5F7; --t2:#AEAEB2; --t3:#636366; --line:#2A2A2C; --border-classic:rgba(255,255,255,0.08);
  --accentBg:rgba(44,94,232,0.16); --greenBg:rgba(42,157,92,0.16); --redBg:rgba(214,58,58,0.16); --amberBg:rgba(196,124,0,0.16); --blueBg:rgba(44,94,232,0.16);
  --c-violetIn:rgba(44,94,232,0.16); --c-coralIn:rgba(214,58,58,0.16); --c-limeIn:rgba(42,157,92,0.16); --c-skyIn:rgba(44,94,232,0.16);
  --hard:0 1px 2px rgba(0,0,0,0.3); --hard-sm:0 1px 2px rgba(0,0,0,0.25); --hard-lg:0 8px 32px rgba(0,0,0,0.5);
}
/* Classic shapes: thin borders, soft radius */
body[data-design="classic"] .tile { border:1px solid var(--border-classic); box-shadow:var(--hard); border-radius:14px; }
body[data-design="classic"] .tile-flat { border:1px solid var(--border-classic); border-radius:12px; }
body[data-design="classic"] .tile-hover:hover { transform:none; box-shadow:var(--hard-lg) !important; border-color:var(--border-classic) !important; }
body[data-design="classic"] .pill { border:1px solid transparent; box-shadow:none; border-radius:9px; font-weight:600; }
body[data-design="classic"] .pill:hover { transform:none; box-shadow:0 2px 8px rgba(20,19,15,0.10); }
body[data-design="classic"] .pill:active { transform:none; }
/* Classic disables aurora bg */
body[data-design="classic"]::before { display:none; }
/* Classic dock → cleaner */
body[data-design="classic"] .dock { background:var(--paper); border:1px solid var(--border-classic); box-shadow:0 8px 32px rgba(20,19,15,0.12); }
body[data-design="classic"] .dock-item { color:var(--t3); }
body[data-design="classic"] .dock-item:hover { background:var(--paper2); color:var(--text); }
body[data-design="classic"] .dock-item.active { background:var(--accent); color:#fff; }
body[data-design="classic"] ::-webkit-scrollbar-thumb { background:var(--line); border:2px solid var(--bg2); }
body[data-design="classic"] .toggle-track.on { background:var(--accent); }


*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:var(--bg2); }
::-webkit-scrollbar-thumb { background:var(--ink); border:2px solid var(--bg2); border-radius:0; }

input,select,button,textarea { font-family:var(--font); color:var(--text); }
a { color:var(--accent); text-decoration:none; }

/* ── Bento tile: thick border + hard shadow ── */
.tile {
  background:var(--paper);
  border:2px solid var(--border);
  border-radius:16px;
  box-shadow:var(--hard);
  position:relative;
}
.tile-flat {
  background:var(--paper);
  border:2px solid var(--border);
  border-radius:16px;
}
.tile-hover { transition:transform 0.14s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.14s; cursor:pointer; }
.tile-hover:hover { transform:translate(-2px,-2px); box-shadow:var(--hard-lg); }
.tile-hover:active { transform:translate(0,0); box-shadow:var(--hard-sm); }

/* ── Dock (bottom command pier) ── */
.dock {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  z-index:400; display:flex; align-items:center; gap:4px;
  background:var(--ink); border-radius:20px; padding:7px;
  box-shadow:0 12px 40px rgba(0,0,0,0.35);
}
.dock-item {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  width:62px; padding:8px 4px; border-radius:14px; cursor:pointer;
  color:rgba(255,255,255,0.55); transition:all 0.16s; position:relative;
  border:none; background:transparent;
}
.dock-item:hover { color:#fff; background:rgba(255,255,255,0.08); }
.dock-item.active { color:var(--ink); background:#fff; }
.dock-ico { font-size:18px; line-height:1; }
.dock-lbl { font-size:9.5px; font-weight:700; letter-spacing:-0.01em; }
.dock-badge {
  position:absolute; top:3px; right:9px; min-width:16px; height:16px;
  background:var(--c-coral); color:#fff; border-radius:99px; font-size:9px;
  font-weight:800; display:flex; align-items:center; justify-content:center;
  padding:0 4px; border:1.5px solid var(--ink);
}

/* Chunky pill button */
.pill {
  border:2px solid var(--border); border-radius:99px;
  font-weight:700; cursor:pointer; transition:transform 0.12s, box-shadow 0.12s;
  font-family:var(--font); letter-spacing:-0.01em;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  box-shadow:var(--hard-sm);
}
.pill:hover { transform:translate(-1px,-1px); box-shadow:var(--hard); }
.pill:active { transform:translate(0,0); box-shadow:1px 1px 0 var(--ink); }

/* ── Calendar ── */
.cal-scroll { scrollbar-width:none; -ms-overflow-style:none; }
.cal-scroll::-webkit-scrollbar { width:0; height:0; display:none; }
.cal-ev { transition:opacity 0.1s, transform 0.1s; cursor:pointer; }
.cal-ev:hover { opacity:0.9 !important; transform:scale(1.02); z-index:20 !important; box-shadow:var(--hard-sm) !important; }
.cal-cell { transition:background 0.08s; }
.cal-cell:hover { background:var(--paper2) !important; }

/* ── Animations ── */
@keyframes popIn { from{opacity:0;transform:scale(0.96) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
.anim-fade-up { animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes pgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.pg-enter { animation:pgIn 0.26s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes pdot { 0%,100%{opacity:1} 50%{opacity:0.35} }
.pulse-dot { animation:pdot 1.5s ease-in-out infinite; }
@keyframes ringDraw { from{stroke-dasharray:0 999} }
.ring-path { animation:ringDraw 1s cubic-bezier(0.4,0,0.2,1) both 0.2s; }
@keyframes lineDraw { from{stroke-dashoffset:1000} to{stroke-dashoffset:0} }
.line-path { stroke-dasharray:1000; animation:lineDraw 1.2s cubic-bezier(0.4,0,0.2,1) both 0.3s; }

/* Toggle */
.toggle-wrap { position:relative; display:inline-flex; align-items:center; gap:7px; cursor:pointer; }
.toggle-track { width:40px; height:22px; border-radius:99px; background:var(--paper2); border:2px solid var(--border); transition:background 0.2s; position:relative; flex-shrink:0; }
.toggle-track.on { background:var(--c-lime); }
.toggle-thumb { position:absolute; top:1px; left:1px; width:16px; height:16px; border-radius:50%; background:var(--ink); transition:left 0.2s cubic-bezier(0.34,1.56,0.64,1); }
.toggle-thumb.on { left:19px; }

/* Tooltip */
.tooltip-wrap { position:relative; }
.tooltip-wrap .tooltip-body { display:none; position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-size:11px; font-weight:700; padding:5px 10px; border-radius:8px; white-space:nowrap; pointer-events:none; z-index:999; }
.tooltip-wrap:hover .tooltip-body { display:block; }

/* Mobile */
@keyframes sheetUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
.bottom-sheet { animation:sheetUp 0.3s cubic-bezier(0.22,1,0.36,1) both; border-radius:22px 22px 0 0 !important; max-height:92vh !important; overflow-y:auto !important; width:100% !important; max-width:100% !important; }

.classic-bottomnav { display:none; }
@media (max-width:768px) {
  body[data-design="classic"] .desktop-sidebar { display:none !important; }
  body[data-design="classic"] .desktop-topbar { display:none !important; }
  body[data-design="classic"] .classic-bottomnav { display:flex !important; }
  body[data-design="classic"] .mobile-page { padding:12px 14px 80px !important; }
}
@media (max-width:900px) {
  .bento-grid { grid-template-columns:1fr 1fr !important; }
}
@media (max-width:600px) {
  .bento-grid { grid-template-columns:1fr !important; }
  .span-2,.span-3,.span-4 { grid-column:span 1 !important; }
  .bento-grid > div { grid-row:auto !important; }
  .dock { width:calc(100% - 24px); bottom:12px; padding:6px; gap:2px; justify-content:space-between; }
  .dock-item { width:auto; flex:1; }
  .dock-lbl { font-size:8.5px; }
}
@media (max-width:768px) {
  button { min-height:38px; }
  input,select,textarea { font-size:16px !important; }
}
.mobile-page { padding:16px 16px 100px; }
.desktop-only { }
@media (max-width:600px) { .desktop-only { display:none !important; } }
</style>

</head>

<script type="text/babel">
const{useState,useMemo,useCallback,useEffect,useRef,Fragment}=React;

/* ── GOOGLE DRIVE SYNC CONFIG ──────────────────────────────────
   Client ID из Google Cloud Console (OAuth 2.0)
──────────────────────────────────────────────────────────── */
const GDRIVE_CLIENT_ID = "990972180057-3omua3qvnleek6tfkap09l4i471cub0a.apps.googleusercontent.com";
const GDRIVE_SCOPE     = "https://www.googleapis.com/auth/drive.appdata";
const GDRIVE_FILE      = "fizmat-hq-data.json";

/* ── Drive state ─────────────────────────────────────────────── */
let gToken  = null;   // current access token
let gFileId = null;   // cached file id on Drive

/* ── Get OAuth token via Google GIS ─────────────────────────── */
function gAuth(){
  return new Promise((resolve, reject)=>{
    if(!window.google||!window.google.accounts){
      reject(new Error("Google API не загрузился. Обновите страницу.")); return;
    }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GDRIVE_CLIENT_ID,
      scope: GDRIVE_SCOPE,
      callback: r=>{
        if(r.error){ reject(new Error("Google: "+r.error)); return; }
        gToken = r.access_token;
        localStorage.setItem("fhq_gdrive_token", r.access_token);
        resolve(r.access_token);
      }
    });
    client.requestAccessToken({prompt: "select_account"});
  });
}

/* ── Find or create the data file on Drive ─────────────────── */
async function gGetFileId(token){
  if(gFileId) return gFileId;
  // NOTE: spaces is a URL param only — NOT inside q filter (that causes 400)
  const q = encodeURIComponent("name='"+GDRIVE_FILE+"' and trashed=false");
  const r = await fetch(
    "https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q="+q+"&fields=files(id)",
    {headers:{Authorization:"Bearer "+token}}
  );
  if(!r.ok){
    const err = await r.text();
    console.error("Drive search error:", r.status, err);
    throw new Error("Drive search "+r.status+": "+err.slice(0,200));
  }
  const j = await r.json();
  if(j.files && j.files.length > 0){ gFileId = j.files[0].id; return gFileId; }
  return null;
}

/* ── Save all data to Drive ─────────────────────────────────── */
async function gSave(data){
  const token = gToken || localStorage.getItem("fhq_gdrive_token");
  if(!token) throw new Error("Нет токена. Войдите через Google.");
  console.log("gSave: saving",Object.keys(data).length,"collections to Drive...");
  const body = JSON.stringify(data);
  let fileId = await gGetFileId(token);
  console.log("gSave: fileId="+fileId);
  if(fileId){
    // Update existing file content only
    const r = await fetch(
      "https://www.googleapis.com/upload/drive/v3/files/"+fileId+"?uploadType=media",
      {method:"PATCH", headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}, body}
    );
    if(!r.ok) throw new Error("Drive PATCH "+r.status);
  } else {
    // Step 1: create file metadata
    const meta = await fetch("https://www.googleapis.com/drive/v3/files", {
      method:"POST",
      headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},
      body: JSON.stringify({name:GDRIVE_FILE, parents:["appDataFolder"]})
    });
    const created = await meta.json();
    if(!created.id) throw new Error("Drive create failed: "+JSON.stringify(created));
    gFileId = created.id;
    // Step 2: upload content
    await fetch(
      "https://www.googleapis.com/upload/drive/v3/files/"+created.id+"?uploadType=media",
      {method:"PATCH", headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}, body}
    );
  }
}

/* ── Load data from Drive ───────────────────────────────────── */
async function gLoad(token){
  console.log("gLoad: searching for file...");
  const fileId = await gGetFileId(token);
  if(!fileId){console.log("gLoad: no file on Drive yet (first time)");return null;}
  console.log("gLoad: found fileId="+fileId+", downloading...");
  const r = await fetch(
    "https://www.googleapis.com/drive/v3/files/"+fileId+"?alt=media",
    {headers:{Authorization:"Bearer "+token}}
  );
  if(!r.ok) throw new Error("Drive GET "+r.status);
  const data = await r.json();
  console.log("gLoad: success, students="+( data.students&&data.students.length));
  return data;
}


/* ── DEVICE DETECT ──────────────────────────────────────────── */
function useDevice() {
  const[w,setW]=useState(window.innerWidth);
  useEffect(()=>{
    const h=()=>setW(window.innerWidth);
    window.addEventListener("resize",h);
    return()=>window.removeEventListener("resize",h);
  },[]);
  return { isMobile:w<768, isTablet:w>=768&&w<1200, isDesktop:w>=1200, width:w };
}

/* ── Constants ───────────────────────────────────────────────── */
const SUBJECTS=["Физика","Математика","Информатика","Химия","Другое"];
const CONTACT_TYPES=["Telegram","WhatsApp","Телефон","Email","VK"];
const DS=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const DF=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const MR=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const CAL_START=8, CAL_END=22;
const CAL_HOURS=Array.from({length:CAL_END-CAL_START},(_,i)=>CAL_START+i);
const ET=[
  {v:"lesson",l:"Урок",c:"#2C5EE8"},
  {v:"work",l:"Работа",c:"#7C3AED"},
  {v:"study",l:"Учёба",c:"#C47C00"},
  {v:"personal",l:"Личное",c:"#2A9D5C"},
  {v:"project",l:"Проект",c:"#5B5BD6"},

/* ── Store ───────────────────────────────────────────────────── */
function useStore(key,def){
  const[v,sv]=useState(()=>{try{const x=localStorage.getItem(key);return x?JSON.parse(x):def;}catch{return def;}});
  const set=useCallback(nv=>{
    sv(prev=>{
      const r=typeof nv==="function"?nv(prev):nv;
      try{localStorage.setItem(key,JSON.stringify(r));}catch{}
      return r;
    });
  },[key]);
  return[v,set];
}

/* ── Utils ───────────────────────────────────────────────────── */
const pad2=n=>String(n).padStart(2,"0");
const localYMD=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const localYM=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
const today=()=>localYMD(new Date());
const sameId=(a,b)=>String(a)===String(b); // type-safe id compare (number vs string from cloud)
const fmtD=d=>{try{return new Date(d).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});}catch{return d;}};
const fmtM=n=>Number(n||0).toLocaleString("ru-RU");
const evc=t=>ET.find(x=>x.v===t)?.c||"#2C5EE8";
const evl=t=>ET.find(x=>x.v===t)?.l||t;
function getWeek(off=0){
  const n=new Date(),d=n.getDay(),m=new Date(n);
  m.setDate(n.getDate()-(d===0?6:d-1)+off*7);
  return Array.from({length:7},(_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return x;});
}
const iso=d=>localYMD(d);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const fdm=(y,m)=>{const d=new Date(y,m,1).getDay();return d===0?6:d-1;};
function useDebounce(v,ms){const[dv,sd]=useState(v);useEffect(()=>{const t=setTimeout(()=>sd(v),ms);return()=>clearTimeout(t);},[v,ms]);return dv;}
const toMin=t=>{if(!t)return 0;const[h,m]=(t||"0:0").split(":").map(Number);return h*60+(m||0);};
const addMin=(t,m)=>{if(!t)return"--:--";try{const d=new Date(`2000-01-01T${t.slice(0,5)}`);d.setMinutes(d.getMinutes()+Number(m)||0);return d.toTimeString().slice(0,5);}catch{return"--:--";}};

function useHourH(){ return 60; } // Fixed 60px/hour for comfortable scrollable calendar

function genRec(rls,excs,students,from,to){
  const res=[],f=new Date(from),t=new Date(to);
  rls.filter(r=>r.active).forEach(r=>{
    const st=students.find(s=>s.id===r.studentId);
    const cur=new Date(f);
    while(cur<=t){
      const wd=cur.getDay()===0?7:cur.getDay();
      if(wd===r.weekday){
        const dk=iso(cur);
        if(!excs.some(e=>e.recurringId===r.id&&e.date===dk))
          res.push({id:`rec_${r.id}_${dk}`,isRecurring:true,recurringId:r.id,
            studentId:r.studentId,title:st?.name||"Урок",type:"lesson",date:dk,
            time:r.time,duration:r.duration,status:"planned",
            price:r.priceOverride!=null?r.priceOverride:(st?.price||0)});
      }
      cur.setDate(cur.getDate()+1);
    }
  });
  return res;
}

function layoutEvents(evs){
  const es=evs.map(e=>({...e,_s:toMin(e.time),_e:toMin(e.time)+(Number(e.duration)||60)}));
  es.sort((a,b)=>a._s-b._s||(a.id>b.id?1:-1));
  const colEnds=[];
  es.forEach(ev=>{
    let col=-1;
    for(let i=0;i<colEnds.length;i++){if(colEnds[i]<=ev._s){col=i;break;}}
    if(col===-1){col=colEnds.length;colEnds.push(0);}
    colEnds[col]=ev._e;ev._col=col;
  });
  const total=Math.max(1,colEnds.length);
  return es.map(ev=>({...ev,_total:total}));
}

/* Donut chart — beautiful SVG ring */
function DonutChart({segments,size=160,stroke=18,label,sublabel}){
  const r=(size-stroke)/2;
  const circ=2*Math.PI*r;
  const total=segments.reduce((s,x)=>s+(x.value||0),0)||1;
  let offset=0;
  const arcs=segments.map(seg=>{
    const pct=(seg.value||0)/total;
    const dash=pct*circ;
    const arc={...seg,dash,offset,startDeg:offset/circ*360};
    offset+=dash;
    return arc;
  });
  return(
    <div style={{position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T.surface2} strokeWidth={stroke}/>
        {arcs.map((arc,i)=>(
          <circle
            key={i}
            cx={size/2} cy={size/2} r={r}
            fill="none"
            stroke={arc.color}
            strokeWidth={stroke}
            strokeDasharray={`${arc.dash} ${circ}`}
            strokeDashoffset={-arc.offset}
            strokeLinecap="round"
            className="ring-path"
            style={{transitionDelay:`${i*0.08}s`}}
          />
        ))}
      </svg>
      {(label||sublabel)&&(
        <div style={{
          position:"absolute",textAlign:"center",
          pointerEvents:"none"
        }}>
          {label&&<div style={{fontSize:20,fontWeight:800,letterSpacing:"-0.04em",color:T.text,lineHeight:1}}>{label}</div>}
          {sublabel&&<div style={{fontSize:11,color:T.t3,marginTop:3,fontWeight:500}}>{sublabel}</div>}
        </div>
      )}
    </div>
  );
}

/* Line chart — smooth SVG polyline */
function LineChart({data,height=100,color="#2C5EE8",valueKey="v",labelKey="l",fill=true}){
  if(!data||data.length<2)return<div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:T.t3,fontSize:12}}>Мало данных</div>;
  const max=Math.max(...data.map(x=>x[valueKey]||0),1);
  const min=Math.min(...data.map(x=>x[valueKey]||0),0);
  const range=Math.max(max-min,1);
  const w=300,h=height-24;
  const pts=data.map((x,i)=>{
    const px=(i/(data.length-1))*w;
    const py=h-(((x[valueKey]||0)-min)/range)*h;
    return[px,py];
  });
  const poly=pts.map(p=>p.join(",")).join(" ");
  const area=`M${pts[0][0]},${h} ${pts.map(p=>`L${p[0]},${p[1]}`).join(" ")} L${pts[pts.length-1][0]},${h} Z`;
  return(
    <div style={{width:"100%"}}>
      <svg viewBox={`0 0 ${w} ${height}`} style={{width:"100%",overflow:"visible"}}>
        <defs>
          <linearGradient id={`grad_${color.replace("#","")}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.18"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {fill&&<path d={area} fill={`url(#grad_${color.replace("#","")})`}/>}
        <polyline points={poly} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="line-path"/>
        {pts.map(([px,py],i)=>(
          <circle key={i} cx={px} cy={py} r={3.5} fill={T.surface} stroke={color} strokeWidth={2}/>
        ))}
        {data.map((x,i)=>(
          <text key={i} x={pts[i][0]} y={height-2} textAnchor="middle" fontSize="9" fill={T.t3} fontWeight="500">
            {x[labelKey]||x.m?.slice(5)||""}
          </text>
        ))}
      </svg>
    </div>
  );
}

            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          {status==="loading"?"Подождите...":"Войти через Google"}
        </button>

        <div style={{textAlign:"center",marginTop:20,paddingTop:16,borderTop:"1px solid var(--border)"}}>
          <div style={{fontSize:11,color:"var(--t3)",marginBottom:8}}>Или продолжить без облака</div>
          <button onClick={()=>onAuth(null)}
            style={{background:"none",border:"1px solid var(--border)",borderRadius:8,padding:"8px 18px",cursor:"pointer",fontSize:12,color:"var(--t2)",fontFamily:"var(--font)"}}>
            Работать локально
          </button>
        </div>
      </div>
    </div>
  );
}


function SyncBadge({status}){

  const l={synced:"Сохранено",syncing:"Сохранение...",offline:"Локально",error:"Ошибка"}[status]||"";

    window.addEventListener("keydown",h);

    <div onClick={onClose} style={{position:"fixed",inset:0,background:"var(--modal-bg)",zIndex:800,display:"flex",alignItems:isMobile?"flex-end":"center",justifyContent:"center",backdropFilter:"blur(3px)",padding:isMobile?0:20}}>

        style={{background:T.paper,borderRadius:isMobile?"22px 22px 0 0":"18px",width:"100%",maxWidth:isMobile?"100%":wide?560:440,

          <div style={{fontSize:16,fontWeight:800,letterSpacing:"-0.03em",fontFamily:T.display}}>{title}</div>

function App(){
  const[tab,setTab]=useState("home");

          gToken=savedToken;
          return {type:"google",token:savedToken};
        }
        if(choice==="local") return null;  // user chose local previously
        return undefined;  // first visit → show AuthScreen
      }

  const[syncStatus,setSyncStatus]=useState("offline");

  // Google Drive: restore session from localStorage on reload
  const migratedRef=useRef(false);
  useEffect(()=>{
    const saved=localStorage.getItem("fhq_gdrive_token");
    if(saved&&user&&user.type==="google"&&!migratedRef.current){
      migratedRef.current=true;
      gToken=saved;
      setSyncStatus("syncing");
      gLoad(saved).then(cloud=>{
        if(cloud){
          if(cloud.students?.length)setStudents(cloud.students);
          if(cloud.events?.length)setEvents(cloud.events);
          if(cloud.tasks?.length)setTasks(cloud.tasks);
          if(cloud.payments?.length)setPayments(cloud.payments);
          if(cloud.incomes?.length)setIncomes(cloud.incomes);
          if(cloud.expenses?.length)setExpenses(cloud.expenses);
          if(cloud.brain?.length)setBrain(cloud.brain);
          if(cloud.kb?.length)setKb(cloud.kb);
          if(cloud.journal?.length)setJournal(cloud.journal);
          if(cloud.projects?.length)setProjects(cloud.projects);
          if(cloud.goals?.length)setGoals(cloud.goals);
          if(cloud.rls?.length)setRls(cloud.rls);
          if(cloud.excs?.length)setExcs(cloud.excs);
          if(cloud.expTpl?.length)setExpTpl(cloud.expTpl);
          if(cloud.lessonLog?.length)setLessonLog(cloud.lessonLog);
          if(cloud.dockOrder)setDockOrder(cloud.dockOrder);
          if(cloud.design)setDesign(cloud.design);
          if(cloud.homeTiles)setHomeTiles(cloud.homeTiles);
          if(cloud.pageStyles)setPageStyles(cloud.pageStyles);
        }
        setSyncStatus("synced");
      }).catch(()=>setSyncStatus("error"));
    }
  },[user]);

  // Auto-save to Drive on data changes (debounced 2s)
  const syncTimerRef=useRef(null);
  const triggerSync=useCallback(()=>{
    if(!user||user.type!=="google"||!gToken)return;
    setSyncStatus("syncing");
    clearTimeout(syncTimerRef.current);
    syncTimerRef.current=setTimeout(()=>{
      gSave({events,students,expenses,incomes,tasks,payments,rls,excs,brain,kb,journal,projects,goals,expTpl,lessonLog,dockOrder,design,homeTiles,pageStyles})
        .then(()=>setSyncStatus("synced"))
        .catch(()=>setSyncStatus("error"));
    },2000);
  },[user,events,students,expenses,incomes,tasks,payments,rls,excs,brain,kb,journal,projects,goals,expTpl,lessonLog,dockOrder,design,homeTiles,pageStyles])

  // Auto-save to Drive whenever any data changes (after initial load)
  const firstSyncRef=useRef(true);
  useEffect(()=>{
    if(firstSyncRef.current){firstSyncRef.current=false;return;}
    triggerSync();
  },[events,students,expenses,incomes,tasks,payments,rls,excs,brain,kb,journal,projects,goals,expTpl,lessonLog,dockOrder,design,homeTiles,pageStyles]);

  // Auto-complete past lessons
  const autoComplete=useCallback(()=>{
    const now=new Date();let changed=false;
    // Mark past lessons as done (no income — income comes only from payments)
    const upd=events.map(ev=>{
      if(ev.type!=="lesson"||ev.status==="done"||ev.status==="cancelled"||ev.status==="missed")return ev;
      try{
        if(new Date(ev.date+"T"+(ev.time?ev.time.slice(0,5):"00:00"))<now){
          changed=true;
          return{...ev,status:"done"};
        }
      }catch{}
      return ev;
    });
    // Materialize past recurring lessons as done events
    const pStart=new Date(now);pStart.setMonth(pStart.getMonth()-3);
    const recPast=genRec(rls,excs,students,iso(pStart),iso(now));
    recPast.forEach(r=>{
      const dt=new Date(r.date+"T"+(r.time?r.time.slice(0,5):"00:00"));
      if(dt>=now)return;
      if(upd.some(e=>e.recurringId===r.recurringId&&e.date===r.date))return;
      upd.push({...r,id:"m"+Date.now()+Math.random(),isRecurring:false,status:"done"});
      changed=true;
    });
    if(changed)setEvents([...upd]);
  },[events,students,rls,excs]);
  useEffect(()=>{autoComplete();},[]);

  const[sq,setSq]=useState("");
  const[quickLog,setQuickLog]=useState(null); // {studentId, date} for quick journal after lesson
  const[showSearch,setShowSearch]=useState(false);
  const[palOpen,setPalOpen]=useState(false);
  const[moreOpen,setMoreOpen]=useState(false);
  const[settingsOpen,setSettingsOpen]=useState(false);
  const[dockEdit,setDockEdit]=useState(false);
  const[dragI,setDragI]=useState(null);
  const[overI,setOverI]=useState(null);
  const[calModal,setCalModal]=useState(false);
  const sRef=useRef(null);
  const sq2=useDebounce(sq,300);

  const sIdx=useMemo(()=>[
    ...students.map(s=>({type:"Ученик",title:s.name+(s.subject?" · "+s.subject:""),tab:"students"})),
    ...events.map(e=>({type:"Событие",title:e.title,tab:"calendar"})),
    ...tasks.map(t=>({type:"Задача",title:t.title,tab:"tasks"})),
    ...projects.map(p=>({type:"Проект",title:p.title,tab:"projects"})),
    ...brain.map(b=>({type:"Знание",title:b.title,tab:"brain"})),
    ...(Array.isArray(lessonLog)?lessonLog:[]).map(l=>{const st=students.find(s=>sameId(s.id,l.studentId));return{type:"Урок",title:l.topic+(st?" — "+st.name:""),tab:"students"};}),
    ...kb.map(k=>({type:"База знаний",title:k.title||k.topic,tab:"kb"})),
  ],[students,events,tasks,projects,brain,lessonLog,kb]);

  const sRes=useMemo(()=>{
    if(!sq2.trim())return[];
    const q=sq2.toLowerCase();
    return sIdx.filter(x=>x.title?.toLowerCase().includes(q)).slice(0,8);
  },[sq2,sIdx]);

  useEffect(()=>{
    const h=e=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")return;
      if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();setPalOpen(true);}
      if(e.key==="c"&&!e.ctrlKey&&!e.metaKey){setTab("calendar");setCalModal(true);}
      if(e.key==="h"&&!e.ctrlKey&&!e.metaKey){setTab("home");}
    };
    window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
  },[]);

  function expData(){
    const d={events,students,expenses,incomes,tasks,ideas,projects,goals,journal,kb,offline,payments,rls,excs,brain,expTpl,lessonLog,dockOrder,design,homeTiles,pageStyles,_exported:new Date().toISOString()};
    const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`fizmat_${today()}.json`;a.click();
  }

  // Export a concise summary as printable PDF (schedule + students + finances)
  function exportPDF(){
    const t=today(),mStr=localYM(new Date());
    const wDates=getWeek(0);
    const wS=iso(wDates[0]),wE=iso(wDates[6]);
    const recW=genRec(rls,excs,students,wS,wE);
    const weekEv=[...events.filter(e=>e.date>=wS&&e.date<=wE),...recW.filter(r=>!events.some(e=>e.date===r.date&&e.time===r.time&&e.studentId===r.studentId))].sort((a,b)=>(a.date+a.time)>(b.date+b.time)?1:-1);
    const mInc=incomes.filter(i=>i.date?.startsWith(mStr)).reduce((s,i)=>s+(Number(i.amount)||0),0);
    const mExp=expenses.filter(e=>e.date?.startsWith(mStr)).reduce((s,e)=>s+(Number(e.amount)||0),0);
    const DSloc=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
    const rows=weekEv.map(e=>{const st=students.find(s=>sameId(s.id,e.studentId));const d=new Date(e.date);return `<tr><td>${DSloc[d.getDay()]} ${d.getDate()}.${String(d.getMonth()+1).padStart(2,"0")}</td><td>${e.time?.slice(0,5)||""}</td><td>${e.title||st?.name||"Событие"}</td><td>${st?.subject||""}</td><td style="text-align:right">${e.type==="lesson"?fmtM(e.price||st?.price||0)+" ₽":""}</td></tr>`;}).join("");
    const studRows=students.map(s=>{
      const ch=events.filter(e=>sameId(e.studentId,s.id)&&e.date.startsWith(mStr)&&e.type==="lesson"&&e.status==="done").length*(Number(s.price)||0);
      const pd=payments.filter(p=>sameId(p.studentId,s.id)&&p.date?.startsWith(mStr)&&p.status!=="cancelled").reduce((a,p)=>a+(Number(p.amount)||0),0);
      const debt=Math.max(0,ch-pd);
      return `<tr><td>${s.name}</td><td>${s.subject||""}</td><td style="text-align:right">${fmtM(s.price||0)} ₽</td><td style="text-align:right;color:${debt>0?"#c0392b":"#16a34a"}">${debt>0?fmtM(debt)+" ₽":"оплачено"}</td></tr>`;
    }).join("");
    const html=`<html><head><meta charset=utf-8><title>FizMat HQ — Сводка</title>
      <style>body{font-family:-apple-system,Arial,sans-serif;max-width:760px;margin:24px auto;padding:20px;color:#18181b}
      h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:24px 0 8px;color:#6c4ce0}
      .sub{color:#888;font-size:12px;margin-bottom:16px}
      table{width:100%;border-collapse:collapse;font-size:12px}
      th{text-align:left;padding:6px 8px;border-bottom:2px solid #18181b;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#666}
      td{padding:6px 8px;border-bottom:1px solid #eee}
      .kpi{display:flex;gap:16px;margin:12px 0}.kpi div{flex:1;background:#f4f2fb;border-radius:10px;padding:12px}
      .kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:#666}</style></head><body>
      <h1>FizMat HQ — Сводка</h1>
      <div class="sub">${new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})} · ${MN[new Date().getMonth()]} ${new Date().getFullYear()}</div>
      <div class="kpi">
        <div><b>${students.length}</b><span>учеников</span></div>
        <div><b>${fmtM(mInc)} ₽</b><span>доход месяца</span></div>
        <div><b>${fmtM(mInc-mExp)} ₽</b><span>прибыль</span></div>
        <div><b>${weekEv.filter(e=>e.type==="lesson").length}</b><span>уроков на неделе</span></div>
      </div>
      <h2>Расписание недели</h2>
      <table><tr><th>День</th><th>Время</th><th>Событие</th><th>Предмет</th><th style="text-align:right">Сумма</th></tr>${rows||'<tr><td colspan=5 style="color:#999">Нет событий</td></tr>'}</table>
      <h2>Ученики и оплата (${MN[new Date().getMonth()]})</h2>
      <table><tr><th>Имя</th><th>Предмет</th><th style="text-align:right">Цена</th><th style="text-align:right">Долг</th></tr>${studRows||'<tr><td colspan=4 style="color:#999">Нет учеников</td></tr>'}</table>
      </body></html>`;
    const w=window.open("","_blank");
    if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),300);}
  }

  // Export data as Excel (.xls via HTML table — opens in Excel)
  function exportExcel(){
    const mStr=localYM(new Date());
    const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
    const sheet=(title,headers,rows)=>`<table border=1><tr><td colspan=${headers.length} style="font-weight:bold;font-size:14px">${title}</td></tr><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table><br/>`;
    const studs=students.map(s=>{
      const done=events.filter(e=>sameId(e.studentId,s.id)&&e.type==="lesson"&&e.status==="done").length;
      const ch=done*(Number(s.price)||0);
      const pd=payments.filter(p=>sameId(p.studentId,s.id)&&p.status!=="cancelled").reduce((a,p)=>a+(Number(p.amount)||0),0);
      return [s.name,s.subject||"",s.grade||"",s.price||0,done,s.payMethod||"",Math.max(0,ch-pd)];
    });
    const evs=events.filter(e=>e.type==="lesson").sort((a,b)=>a.date>b.date?1:-1).map(e=>{const st=students.find(s=>sameId(s.id,e.studentId));return [e.date,e.time?.slice(0,5)||"",st?.name||e.title||"",e.status||"",e.price||st?.price||0];});
    const fins=[...incomes.map(i=>[i.date,"Доход",i.type||"",i.amount||0]),...expenses.map(x=>[x.date,"Расход",x.category||"",-(x.amount||0)])].sort((a,b)=>a[0]>b[0]?1:-1);
    const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset=utf-8></head><body>
      ${sheet("УЧЕНИКИ",["Имя","Предмет","Класс","Цена","Уроков","Оплата","Долг"],studs)}
      ${sheet("ЗАНЯТИЯ",["Дата","Время","Ученик","Статус","Сумма"],evs)}
      ${sheet("ФИНАНСЫ",["Дата","Тип","Категория","Сумма"],fins)}
      </body></html>`;
    const blob=new Blob(["\ufeff"+html],{type:"application/vnd.ms-excel"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=`fizmat-hq-${today()}.xls`;a.click();URL.revokeObjectURL(url);
  }
  function impData(){
    const inp=document.createElement("input");inp.type="file";inp.accept=".json";
    inp.onchange=e=>{const f=e.target.files[0];if(!f)return;
      const r=new FileReader();r.onload=ev=>{
        try{const d=JSON.parse(ev.target.result);
          if(d.events)setEvents(d.events);if(d.students)setStudents(d.students);
          if(d.expenses)setExpenses(d.expenses);if(d.incomes)setIncomes(d.incomes);
          if(d.tasks)setTasks(d.tasks);if(d.ideas)setIdeas(d.ideas);
          if(d.projects)setProjects(d.projects);if(d.goals)setGoals(d.goals);
          if(d.journal)setJournal(d.journal);if(d.kb)setKb(d.kb);
          if(d.payments)setPayments(d.payments);
          if(d.rls||d.recurringLessons)setRls(d.rls||d.recurringLessons);
          if(d.excs||d.exceptions)setExcs(d.excs||d.exceptions);
          if(d.brain)setBrain(d.brain);
          // Immediately save imported data to Google Drive
          if(gToken){
            setSyncStatus("syncing");
            setTimeout(()=>{
              gSave(d)
                .then(()=>{setSyncStatus("synced");alert("Данные импортированы и сохранены на Google Диск ✓");})
                .catch(()=>{setSyncStatus("error");alert("Данные импортированы локально, но ошибка при сохранении в Drive. Войдите заново.");});
            },300);
          } else {
            alert("Данные импортированы локально ✓\nЧтобы синхронизировать — войдите через Google на этой странице.");
          }
        }catch{alert("Ошибка файла");}
      };r.readAsText(f);};inp.click();
  }

  function signOut(){
    gToken=null;
    gFileId=null;

/* Quick journal modal — opens from Home after completed lesson */
function QuickLogModal({store,onClose}){
  const{lessonLog,setLessonLog,students,quickLog}=store;
  const[form,setForm]=useState({date:quickLog?.date||today()});
  const st=students.find(s=>sameId(s.id,quickLog?.studentId));
  function save(){
    if(!form.topic||!form.topic.trim()){alert("Укажите тему урока");return;}
    setLessonLog(prev=>[...(Array.isArray(prev)?prev:[]),{...form,topic:form.topic.trim(),studentId:quickLog.studentId,id:Date.now()}]);
    onClose();
  }
  return(
    <Modal title={`Журнал урока — ${st?.name||"ученик"}`} onClose={onClose}>
      <div style={{background:"#EEF2FF",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:12,color:T.accent,fontWeight:500}}>
        📚 {st?.subject} · {fmtD(form.date)}
      </div>
      <Field label="Тема урока" required>
        <Inp value={form.topic} onChange={v=>setForm(p=>({...p,topic:v}))} placeholder="Например: Законы Ньютона"/>
      </Field>
      <Field label="Что получилось">
        <Txa value={form.result} onChange={v=>setForm(p=>({...p,result:v}))} rows={2} placeholder="Разобрали теорию, решили 5 задач..."/>
      </Field>
      <Field label="Домашнее задание">
        <Inp value={form.homework} onChange={v=>setForm(p=>({...p,homework:v}))} placeholder="Задачи 12-15 из сборника"/>
      </Field>
      <Field label="Следующий шаг">
        <Inp value={form.nextStep} onChange={v=>setForm(p=>({...p,nextStep:v}))} placeholder="Перейти к электричеству"/>
      </Field>
      <SaveRow onClose={onClose} onSave={save}/>
    </Modal>
  );
}


function Home({store,setTab}){
  const{events,students,expenses,incomes,tasks,goals,rls,excs,payments,lessonLog,setQuickLog,homeTiles,setHomeTiles}=store;
  const now=new Date(),t=today(),mStr=localYM(now);
  const wDates=getWeek(0),wS=iso(wDates[0]),wE=iso(wDates[6]);
  const recW=useMemo(()=>genRec(rls,excs,students,wS,wE),[rls,excs,students,wS,wE]);
  const allW=[...events.filter(e=>e.date>=wS&&e.date<=wE),
    ...recW.filter(r=>!events.some(e=>e.date===r.date&&e.time===r.time&&e.studentId===r.studentId))];
  const mInc=incomes.filter(i=>i.date.startsWith(mStr)).reduce((s,i)=>s+(Number(i.amount)||0),0);
  const mExp=expenses.filter(e=>e.date.startsWith(mStr)).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const pStr=localYM(new Date(now.getFullYear(),now.getMonth()-1,1));
  const pInc=incomes.filter(i=>i.date.startsWith(pStr)).reduce((s,i)=>s+(Number(i.amount)||0),0);
  const incTrend=pInc>0?{dir:mInc>=pInc?"↑":"↓",pct:Math.abs(Math.round((mInc-pInc)/pInc*100)),up:mInc>=pInc}:null;
  const todayRec=genRec(rls,excs,students,t,t);
  const todayEv=[...events.filter(e=>e.date===t),
    ...todayRec.filter(r=>!events.some(e=>e.date===r.date&&e.time===r.time&&e.studentId===r.studentId))]
    .sort((a,b)=>a.time>b.time?1:-1);
  const nowStr=now.toTimeString().slice(0,5);
  const currentEv=useMemo(()=>todayEv.find(ev=>{
    try{const end=addMin(ev.time||"00:00",Number(ev.duration)||60);
      return(ev.time?.slice(0,5)||"")<=nowStr&&nowStr<end;}catch{return false;}
  }),[todayEv,nowStr]);
  const nextEv=todayEv.find(e=>(e.time?.slice(0,5)||"")>nowStr);
  const todayL=todayEv.filter(e=>e.type==="lesson");
  const mLessDone=events.filter(e=>e.date.startsWith(mStr)&&e.type==="lesson"&&e.status==="done").length;
  const pendPay=students.map(s=>{
    const ch=events.filter(e=>sameId(e.studentId,s.id)&&e.date.startsWith(mStr)&&e.type==="lesson"&&e.status==="done").length*(Number(s.price)||0);
    const pd=payments.filter(p=>sameId(p.studentId,s.id)&&p.date?.startsWith(mStr)&&p.status!=="cancelled").reduce((a,p)=>a+(Number(p.amount)||0),0);
    return{s,left:Math.max(0,ch-pd)};
  }).filter(x=>x.left>0);
  const todayForecast=todayL.reduce((s,l)=>{const st=students.find(x=>x.id===l.studentId);return s+(Number(l.price||st?.price)||0);},0);
  const overdueTasks=tasks.filter(t=>t.status!=="done"&&t.deadline&&t.deadline<today());
  const activeTasks=tasks.filter(t=>t.status!=="done");
  const greetHour=now.getHours();
  const greet=greetHour<12?"Доброе утро":greetHour<18?"Добрый день":"Добрый вечер";
  const MN2=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

  // "Что сделать сегодня" список
  const todayActions=[];

    const st=students.find(s=>s.id===l.studentId);
    todayActions.push({icon:"📚",text:`Урок — ${st?.name||"ученик"} в ${l.time?.slice(0,5)}`,tab:"calendar"});
  });
  pendPay.slice(0,3).forEach(({s,left})=>{
    todayActions.push({icon:"💰",text:`Напомнить об оплате — ${s.name} (${fmtM(left)} ₽)`,tab:"payments"});
  });
  overdueTasks.slice(0,2).forEach(t2=>{
    todayActions.push({icon:"⚠️",text:`Просроченная задача: ${t2.title}`,tab:"tasks"});
  });
  // Completed lessons today without a journal entry
  const doneTodayNoLog=todayL.filter(l=>l.status==="done").filter(l=>{
    return !(Array.isArray(lessonLog)?lessonLog:[]).some(j=>sameId(j.studentId,l.studentId)&&j.date===t);
  });
  doneTodayNoLog.slice(0,3).forEach(l=>{
    const st=students.find(s=>s.id===l.studentId);
    todayActions.push({icon:"📔",text:`Заполнить журнал — ${st?.name||"ученик"}`,tab:"_quicklog",studentId:l.studentId,date:t});
  });

    todayActions.push({icon:"✅",text:"Свободный день — всё под контролем",tab:"home"});

          <div><div style={{fontSize:24,fontWeight:800,fontFamily:T.display,lineHeight:1}}>{fmtM(todayForecast)}</div><div style={{fontSize:11,opacity:0.7,fontWeight:600}}>прогноз ₽</div></div>
        </div>
      </div>
    )},
    income:{title:"Доход месяца",defSpan:1,defColor:"mint",render:()=>(

        {incTrend&&<div style={{fontSize:12,fontWeight:700,color:incTrend.up?T.green:T.red,marginTop:6}}>{incTrend.dir} {incTrend.pct}%</div>}</div>

    debt:{title:"Долги",defSpan:1,defColor:"coral",onClick:()=>setTab("payments"),render:()=>(
      <div style={{display:"flex",flexDirection:"column",justifyContent:"space-between",height:"100%",minHeight:120}}>

          </div>}
      </div>
    )},
    pendingPay:{title:"Ожидают оплаты",defSpan:2,defColor:"paper",render:()=>(
      <div style={{minHeight:180}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontSize:16,fontWeight:800,fontFamily:T.display,letterSpacing:"-0.03em"}}>Ожидают оплаты</div>
          {pendPay.length>0&&<span style={{fontSize:11,fontWeight:800,background:"var(--c-coral)",color:"#fff",borderRadius:99,padding:"3px 10px",border:`2px solid ${T.border}`}}>{pendPay.length}</span>}

              <div key={s.id} onClick={()=>setTab("payments")} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${T.line}`,cursor:"pointer"}}>
                <div><div style={{fontWeight:700,fontSize:13}}>{s.name}</div><div style={{fontSize:11,color:T.t3,fontWeight:600}}>{s.subject}</div></div>
                <span style={{fontWeight:800,color:T.red,fontSize:14,fontFamily:T.display}}>{fmtM(left)} ₽</span>
              </div>
            ))}
          </div>}
      </div>
    )},
  };

  const DEFAULT_TILES=[
    {id:"greeting",span:2,color:"violet"},{id:"income",span:1,color:"mint"},{id:"debt",span:1,color:"coral"},
    {id:"todo",span:2,color:"paper"},{id:"profit",span:1,color:"sky"},{id:"lessonsDone",span:1,color:"amber"},
    {id:"todaySchedule",span:2,color:"paper"},{id:"pendingPay",span:2,color:"paper"},
  ];
  const tiles=(Array.isArray(homeTiles)&&homeTiles.length?homeTiles:DEFAULT_TILES).filter(t=>t.custom||TILE_DEFS[t.id]);
  // ensure new built-in tiles appear
  DEFAULT_TILES.forEach(d=>{if(!tiles.some(t=>t.id===d.id))tiles.push(d);});

  const[editMode,setEditMode]=useState(false);
  const[dragTile,setDragTile]=useState(null);
  const[noteModal,setNoteModal]=useState(null);

  function updateTile(id,patch){setHomeTiles(tiles.map(t=>t.id===id?{...t,...patch}:t));}
  function cycleSpan(id){const t=tiles.find(x=>x.id===id);const order=[1,2,4];const cur=order.indexOf(t.span||1);updateTile(id,{span:order[(cur+1)%order.length]});}
  function hideTile(id){setHomeTiles(tiles.filter(t=>t.id!==id));}
  function addNote(){const id="note_"+Date.now();setHomeTiles([...tiles,{id,custom:true,span:1,color:"amber",title:"Заметка",text:""}]);setNoteModal(id);}
  function resetTiles(){setHomeTiles(null);setEditMode(false);}
  function moveTile(from,to){const a=[...tiles];const[m]=a.splice(from,1);a.splice(to,0,m);setHomeTiles(a);}

  const SPAN_CLASS={1:"",2:"span-2",4:"span-4"};

  return(
    <div>

          <span className="pulse-dot" style={{width:10,height:10,borderRadius:"50%",background:T.ink,flexShrink:0}}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:800,fontSize:15,color:T.ink,letterSpacing:"-0.02em"}}>Сейчас идёт урок — {students.find(s=>s.id===currentEv.studentId)?.name||currentEv.title}</div>
            <div style={{fontSize:12,color:T.ink,opacity:0.65,fontWeight:600}}>{currentEv.time?.slice(0,5)} — {addMin(currentEv.time||"00:00",Number(currentEv.duration)||60)}</div>
          </div>
        </div>
      )}

      {/* Edit toolbar */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>

        <div style={{display:"flex",gap:8}}>
          {editMode&&<Btn size="sm" variant="secondary" onClick={addNote}>+ Заметка</Btn>}
          {editMode&&<Btn size="sm" variant="ghost" onClick={resetTiles}>Сбросить</Btn>}
          <Btn size="sm" variant={editMode?"lime":"secondary"} onClick={()=>setEditMode(v=>!v)}>{editMode?"✓ Готово":"⚙ Настроить экран"}</Btn>
        </div>
      </div>

      {/* Bento grid */}
      <div className="bento-grid" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,gridAutoRows:"minmax(0,auto)"}}>
        {tiles.map((t,i)=>{
          const def=t.custom?null:TILE_DEFS[t.id];
          const span=Math.min(t.span||1,4);
          const[bg,fg]=COLORS[t.color]||COLORS.paper;
          const clickable=!editMode&&def?.onClick;
          return(
            <div key={t.id}
              className={`tile ${SPAN_CLASS[span]||""} ${clickable?"tile-hover":""}`}
              draggable={editMode}
              onDragStart={editMode?(e=>{e.dataTransfer.effectAllowed="move";setDragTile(i);}):undefined}
              onDragOver={editMode?(e=>e.preventDefault()):undefined}
              onDrop={editMode?(e=>{e.preventDefault();if(dragTile!==null&&dragTile!==i)moveTile(dragTile,i);setDragTile(null);}):undefined}
              onClick={clickable?def.onClick:undefined}
              style={{gridColumn:span>1?`span ${span}`:undefined,background:bg,padding:20,color:fg||undefined,position:"relative",
                opacity:dragTile===i?0.4:1,cursor:editMode?"grab":(clickable?"pointer":"default"),
                outline:editMode?`2px dashed ${T.border}`:undefined}}>
              {editMode&&(
                <div style={{position:"absolute",top:6,right:6,display:"flex",gap:3,zIndex:5}}>
                  <button onClick={e=>{e.stopPropagation();cycleSpan(t.id);}} title="Размер" style={{width:24,height:24,borderRadius:6,border:`1.5px solid ${T.border}`,background:T.paper,color:T.text,cursor:"pointer",fontSize:10,fontWeight:800}}>{span}×</button>

                  <button onClick={e=>{e.stopPropagation();hideTile(t.id);}} title="Скрыть" style={{width:24,height:24,borderRadius:6,border:`1.5px solid ${T.border}`,background:T.paper,color:T.red,cursor:"pointer",fontSize:13,fontWeight:800}}>×</button>
                </div>
              )}
              {editMode&&(
                <div style={{position:"absolute",bottom:6,left:6,display:"flex",gap:3,zIndex:5}}>
                  {COLOR_LIST.map(c=>{const[cb]=COLORS[c];return(
                    <button key={c} onClick={e=>{e.stopPropagation();updateTile(t.id,{color:c});}} style={{width:16,height:16,borderRadius:"50%",background:cb,border:t.color===c?`2px solid ${T.ink}`:`1.5px solid ${T.border}`,cursor:"pointer",padding:0}}/>
                  );})}
                </div>

              <div style={{paddingBottom:editMode?28:0,pointerEvents:editMode?"none":"auto"}}>
                {t.custom
                  ?<div style={{minHeight:90}}><div style={{fontSize:14,fontWeight:800,fontFamily:T.display,marginBottom:6,color:fg||T.text}}>{t.title||"Заметка"}</div><div style={{fontSize:13,color:fg?"rgba(255,255,255,0.85)":T.t2,whiteSpace:"pre-wrap",lineHeight:1.5}}>{t.text||"Нажми ✎ чтобы добавить текст"}</div></div>
                  :def?.render(span>=2)}
              </div>
            </div>
          );
        })}
      </div>

      {/* Note editor */}
      {noteModal&&(()=>{
        const nt=tiles.find(t=>t.id===noteModal);if(!nt)return null;
        return(
          <Modal title="Своя плитка" onClose={()=>setNoteModal(null)}>
            <Field label="Заголовок"><Inp value={nt.title} onChange={v=>updateTile(noteModal,{title:v})} placeholder="Например: Важно"/></Field>
            <Field label="Текст"><Txa value={nt.text} onChange={v=>updateTile(noteModal,{text:v})} rows={4} placeholder="Любая заметка, напоминание, ссылка..."/></Field>
            <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}><Btn onClick={()=>setNoteModal(null)}>Готово</Btn></div>
          </Modal>
        );
      })()}
    </div>
  );
}

  const inc=incomes.filter(i=>i.date>=wS&&i.date<=wE).reduce((s,i)=>s+(Number(i.amount)||0),0);
  const planInc=lessons.filter(e=>e.status==="planned").reduce((s,l)=>{
    const st=students.find(x=>x.id===l.studentId);return s+(Number(l.price||st?.price)||0);

  const now=new Date(),mStr=localYM(now);

                const dk=iso(d),cnt=allEv.filter(e=>e.date===dk).length;
                const mx=Math.max(...dates.map(x=>allEv.filter(e=>e.date===iso(x)).length),1);

                return(
                  <div key={dk} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>

              <div style={{fontSize:11,color:T.t2,marginTop:1,marginBottom:8}}>≈ {Math.ceil(toGoal/Math.max(avgPrice,1))} уроков</div>

        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   CALENDAR — 8:00–22:00, rich event cells
